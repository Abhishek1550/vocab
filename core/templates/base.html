<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vocab{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-gray-50">

    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-8">
                <a href="/" class="text-2xl font-bold text-gray-900">Vocab</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'domain_list' %}" class="text-gray-600 hover:text-gray-900 font-medium">My Domains</a>
                {% endif %}
            </div>
            
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <span class="text-gray-700">Hi, {{ user.email|truncatechars:25 }}</span>
                    <a href="{% url 'account_logout' %}" 
                    class="text-gray-600 hover:text-red-600 font-medium">
                        Logout
                    </a>
                {% else %}
                    <a href="{% url 'account_login' %}" 
                    class="text-gray-700 hover:text-gray-900 font-medium px-5 py-2.5">
                        Log in
                    </a>
                    <a href="{% url 'account_signup' %}" 
                    class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-blue-700 transition">
                        Sign Up Free
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
