{% extends 'base.html' %}

{% block title %}Login - Vocab{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16">
    <div class="bg-white p-8 rounded-2xl shadow-sm">
        <h2 class="text-3xl font-bold text-center mb-8">Welcome Back</h2>
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-4 rounded-xl font-semibold hover:bg-blue-700">
                Log In
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'account_signup' %}" class="text-blue-600 hover:underline">
                Don't have an account? Sign up
            </a>
        </div>
    </div>
</div>
{% endblock %}
